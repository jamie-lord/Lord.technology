---
layout: default
---
<main class="page">
  <section class="blk post-head">
    <div class="prompt">
      <span class="u">jamie</span><span class="at">@</span><span class="host">lord.technology</span><span class="sep">:</span><span class="path">~{{ page.url }}</span> <span class="sep">$</span> <span class="cmd">cat</span> <span class="flag">index</span><span class="cursor" aria-hidden="true"></span>
    </div>
    <h1 class="title">{{ page.title }}</h1>
    {% if page.subtitle %}<p class="hero-sub">{{ page.subtitle }}</p>{% endif %}
  </section>

  <section class="blk blk--tight">
    <article class="prose">
      {{ content }}
    </article>
  </section>

  {% include colophon.html status=page.colophon_status body=page.colophon_body %}
</main>
