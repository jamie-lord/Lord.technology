<header class="masthead">
  <a class="brand" href="{{ '/' | relative_url }}">
    {% include monogram.html %}
    <span class="wm">lord<span class="tld">.technology</span></span>
  </a>
  <nav aria-label="Primary">
    {% for item in site.data.navigation.main %}
      {% assign is_active = false %}
      {% if page.nav_key and page.nav_key == item.key %}{% assign is_active = true %}{% endif %}
      <a href="{{ item.url | relative_url }}"{% if is_active %} class="active"{% endif %}>{{ item.key }}</a>
    {% endfor %}
  </nav>
</header>
