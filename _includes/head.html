<meta charset="utf-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="viewport" content="width=device-width, initial-scale=1">

{% seo title=false %}
{% if page.title %}<title>{{ page.title }} · {{ site.title }}</title>{% else %}<title>{{ site.title }} — {{ site.subtitle | default: site.description }}</title>{% endif %}

<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Person",
  "@id": "{{ site.url }}/#jamie",
  "name": "{{ site.author.name }}",
  "givenName": "Jamie",
  "familyName": "Lord",
  "url": "{{ site.url }}",
  "image": "{{ site.author.avatar | absolute_url }}",
  "jobTitle": "{{ site.author.role }}",
  "worksFor": { "@type": "Organization", "name": "CDS" },
  "address": {
    "@type": "PostalAddress",
    "addressLocality": "Stamford",
    "addressRegion": "Lincolnshire",
    "addressCountry": "GB"
  },
  "description": "{{ site.description | strip_newlines | strip }}",
  "knowsAbout": [
    "Software architecture",
    "Cloudflare",
    "Multi-tenant SaaS",
    "Edge computing",
    "Agentic engineering",
    "Claude Code",
    "Model Context Protocol",
    "C#",
    ".NET",
    "Azure",
    "AWS"
  ],
  "sameAs": [
    "https://github.com/{{ site.author.github }}",
    "https://www.linkedin.com/in/{{ site.author.linkedin }}/",
    "https://architectingoncloudflare.com/",
    "https://nearlyright.com/"
  ]
}
</script>

<link rel="icon" type="image/svg+xml" href="{{ '/assets/images/favicon.svg' | relative_url }}">
<link rel="alternate icon" href="{{ '/favicon.ico' | relative_url }}">
<link rel="apple-touch-icon" href="{{ '/assets/images/apple-touch-icon.png' | relative_url }}">
<meta name="theme-color" content="#05070a">

<link rel="alternate" type="application/atom+xml" title="{{ site.title }}" href="{{ '/feed.xml' | absolute_url }}">

<link rel="preload" href="{{ '/assets/fonts/jetbrains-mono-latin.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="{{ '/assets/fonts/share-tech-mono-latin.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="{{ '/assets/css/vendor/webtui.css' | relative_url }}">
<link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">

{% if site.analytics.google.tracking_id %}
<script async src="https://www.googletagmanager.com/gtag/js?id={{ site.analytics.google.tracking_id }}"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', '{{ site.analytics.google.tracking_id }}');
</script>
{% endif %}
